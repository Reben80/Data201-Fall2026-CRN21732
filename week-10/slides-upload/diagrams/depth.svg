<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">

  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>
  <text x="48" y="44" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">Deeper trees fit more, then memorize</text>
  <rect x="70" y="100" width="300" height="280" rx="16" fill="#ffffff" stroke="#d5dee6"/>
  <text x="220" y="145" text-anchor="middle" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Depth 1</text>
  <rect x="120" y="180" width="200" height="50" rx="10" fill="#0072b2"/>
  <line x1="170" y1="230" x2="140" y2="280" stroke="#1c2430" stroke-width="2"/>
  <line x1="270" y1="230" x2="300" y2="280" stroke="#1c2430" stroke-width="2"/>
  <rect x="90" y="290" width="100" height="40" rx="8" fill="#e7eef5"/>
  <rect x="250" y="290" width="100" height="40" rx="8" fill="#e7eef5"/>
  <text x="220" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Still mixed</text>
  <rect x="410" y="100" width="300" height="280" rx="16" fill="#ffffff" stroke="#d5dee6"/>
  <text x="560" y="145" text-anchor="middle" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Depth 2</text>
  <rect x="485" y="175" width="150" height="40" rx="8" fill="#0072b2"/>
  <rect x="440" y="250" width="100" height="36" rx="8" fill="#0f7a72"/>
  <rect x="590" y="250" width="100" height="36" rx="8" fill="#0f7a72"/>
  <rect x="430" y="320" width="70" height="30" rx="6" fill="#e7eef5"/>
  <rect x="520" y="320" width="70" height="30" rx="6" fill="#e7eef5"/>
  <rect x="610" y="320" width="70" height="30" rx="6" fill="#e7eef5"/>
  <text x="560" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Clearer groups</text>
  <rect x="750" y="100" width="300" height="280" rx="16" fill="#ffffff" stroke="#d5dee6"/>
  <text x="900" y="145" text-anchor="middle" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Depth 9</text>
  <text x="900" y="250" text-anchor="middle" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="650">Pure</text>
  <text x="900" y="300" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">but chasing outliers</text>
  <text x="900" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Overfitting risk</text>
  <text x="560" y="450" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="20">Use cross-validation to choose a depth that generalizes.</text>

</svg>
