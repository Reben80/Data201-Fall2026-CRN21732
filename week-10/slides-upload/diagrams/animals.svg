<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">

  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>
  <text x="48" y="44" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">A tree is a game of questions</text>
  <rect x="420" y="70" width="280" height="70" rx="14" fill="#0072b2"/>
  <text x="560" y="114" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Has feathers?</text>
  <line x1="480" y1="140" x2="280" y2="200" stroke="#1c2430" stroke-width="3"/>
  <line x1="640" y1="140" x2="840" y2="200" stroke="#1c2430" stroke-width="3"/>
  <text x="360" y="185" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="650">yes</text>
  <text x="760" y="185" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="650">no</text>
  <rect x="160" y="210" width="240" height="60" rx="12" fill="#0f7a72"/>
  <text x="280" y="248" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Can fly?</text>
  <rect x="720" y="210" width="240" height="60" rx="12" fill="#c45c26"/>
  <text x="840" y="248" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Has fins?</text>
  <rect x="80" y="340" width="160" height="70" rx="12" fill="#1c2430"/>
  <text x="160" y="382" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Hawk</text>
  <rect x="280" y="340" width="160" height="70" rx="12" fill="#1c2430"/>
  <text x="360" y="382" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Penguin</text>
  <rect x="680" y="340" width="160" height="70" rx="12" fill="#1c2430"/>
  <text x="760" y="382" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Dolphin</text>
  <rect x="880" y="340" width="160" height="70" rx="12" fill="#1c2430"/>
  <text x="960" y="382" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Bear</text>
  <line x1="220" y1="270" x2="160" y2="340" stroke="#1c2430" stroke-width="2"/>
  <line x1="340" y1="270" x2="360" y2="340" stroke="#1c2430" stroke-width="2"/>
  <line x1="780" y1="270" x2="760" y2="340" stroke="#1c2430" stroke-width="2"/>
  <line x1="900" y1="270" x2="960" y2="340" stroke="#1c2430" stroke-width="2"/>
  <text x="560" y="470" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="18">Learning a tree means learning which questions to ask, and in what order.</text>

</svg>
