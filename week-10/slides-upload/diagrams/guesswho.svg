<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>

  <text x="48" y="42" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="700">Guess Who Online → a decision tree</text>
  <text x="48" y="68" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Same moves you just made in the game.</text>

  <!-- Root -->
  <rect x="400" y="92" width="320" height="64" rx="14" fill="#0072b2"/>
  <text x="560" y="122" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Wears glasses?</text>
  <text x="560" y="142" text-anchor="middle" fill="#d6ebf7" font-family="Montserrat, Arial, sans-serif" font-size="13">feature split</text>

  <line x1="460" y1="156" x2="260" y2="210" stroke="#1c2430" stroke-width="3"/>
  <line x1="660" y1="156" x2="860" y2="210" stroke="#1c2430" stroke-width="3"/>
  <text x="340" y="192" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="650">yes</text>
  <text x="780" y="192" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="650">no</text>

  <!-- Level 2 -->
  <rect x="140" y="216" width="240" height="58" rx="12" fill="#0f7a72"/>
  <text x="260" y="243" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Has a beard?</text>
  <text x="260" y="262" text-anchor="middle" fill="#d9f2ef" font-family="Montserrat, Arial, sans-serif" font-size="12">next question</text>

  <rect x="740" y="216" width="240" height="58" rx="12" fill="#c45c26"/>
  <text x="860" y="243" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Has red hair?</text>
  <text x="860" y="262" text-anchor="middle" fill="#f8e5d9" font-family="Montserrat, Arial, sans-serif" font-size="12">next question</text>

  <line x1="200" y1="274" x2="140" y2="330" stroke="#1c2430" stroke-width="2"/>
  <line x1="320" y1="274" x2="380" y2="330" stroke="#1c2430" stroke-width="2"/>
  <line x1="800" y1="274" x2="740" y2="330" stroke="#1c2430" stroke-width="2"/>
  <line x1="920" y1="274" x2="980" y2="330" stroke="#1c2430" stroke-width="2"/>

  <!-- Leaves -->
  <rect x="70" y="336" width="140" height="70" rx="12" fill="#1c2430"/>
  <text x="140" y="366" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Alex</text>
  <text x="140" y="388" text-anchor="middle" fill="#9fb0bf" font-family="Montserrat, Arial, sans-serif" font-size="13">final guess</text>

  <rect x="310" y="336" width="140" height="70" rx="12" fill="#1c2430"/>
  <text x="380" y="366" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Sam</text>
  <text x="380" y="388" text-anchor="middle" fill="#9fb0bf" font-family="Montserrat, Arial, sans-serif" font-size="13">final guess</text>

  <rect x="670" y="336" width="140" height="70" rx="12" fill="#1c2430"/>
  <text x="740" y="366" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Jordan</text>
  <text x="740" y="388" text-anchor="middle" fill="#9fb0bf" font-family="Montserrat, Arial, sans-serif" font-size="13">final guess</text>

  <rect x="910" y="336" width="140" height="70" rx="12" fill="#1c2430"/>
  <text x="980" y="366" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Casey</text>
  <text x="980" y="388" text-anchor="middle" fill="#9fb0bf" font-family="Montserrat, Arial, sans-serif" font-size="13">final guess</text>

  <!-- Mapping strip -->
  <rect x="48" y="430" width="1024" height="48" rx="12" fill="#ffffff" stroke="#d7e0e8"/>
  <text x="560" y="460" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="17">
    Ask a yes/no question → flip the board → repeat → guess. A tree learns which questions to ask.
  </text>
</svg>
