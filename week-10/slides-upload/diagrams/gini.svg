<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">

  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>
  <text x="48" y="44" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">Three ways to score impurity</text>
  <line x1="120" y1="400" x2="1000" y2="400" stroke="#1c2430" stroke-width="2"/>
  <line x1="120" y1="100" x2="120" y2="400" stroke="#1c2430" stroke-width="2"/>
  <path d="M120 400 Q 560 80 1000 400" fill="none" stroke="#0f7a72" stroke-width="4"/>
  <path d="M120 400 Q 560 40 1000 400" fill="none" stroke="#c45c26" stroke-width="4"/>
  <path d="M120 400 L 560 200 L 1000 400" fill="none" stroke="#0072b2" stroke-width="3"/>
  <text x="560" y="430" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">p = proportion Yes</text>
  <text x="140" y="420" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="14">0</text>
  <text x="540" y="420" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="14">0.5</text>
  <text x="980" y="420" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="14">1</text>
  <rect x="140" y="120" width="18" height="18" fill="#0072b2"/>
  <text x="170" y="135" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="16">Misclassification error</text>
  <rect x="140" y="155" width="18" height="18" fill="#0f7a72"/>
  <text x="170" y="170" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="16">Gini = Σ p(1 − p)</text>
  <rect x="140" y="190" width="18" height="18" fill="#c45c26"/>
  <text x="170" y="205" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="16">Entropy = −Σ p log p</text>
  <text x="700" y="150" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18">For 8 Yes and 2 No:</text>
  <text x="700" y="185" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="17">Error = 0.20</text>
  <text x="700" y="215" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="17">Gini = 0.32</text>
  <text x="700" y="245" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="17">Entropy ≈ 0.50</text>
  <text x="560" y="470" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18">Pure at the ends. Most mixed in the middle. Compare splits with the same measure.</text>

</svg>
