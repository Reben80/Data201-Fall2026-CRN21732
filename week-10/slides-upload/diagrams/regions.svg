<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">

  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>
  <text x="48" y="44" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">The same tree as three boxes</text>
  <rect x="80" y="90" width="520" height="340" rx="8" fill="#ffffff" stroke="#d5dee6" stroke-width="2"/>
  <line x1="280" y1="90" x2="280" y2="430" stroke="#0072b2" stroke-width="4"/>
  <line x1="280" y1="250" x2="600" y2="250" stroke="#0f7a72" stroke-width="4"/>
  <text x="180" y="270" text-anchor="middle" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="650">R1</text>
  <text x="180" y="300" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Years &lt; 4.5</text>
  <text x="440" y="180" text-anchor="middle" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="650">R2</text>
  <text x="440" y="210" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Hits &lt; 117.5</text>
  <text x="440" y="340" text-anchor="middle" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="650">R3</text>
  <text x="440" y="370" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Hits ≥ 117.5</text>
  <text x="340" y="460" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Years</text>
  <text x="70" y="270" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Hits</text>
  <rect x="660" y="110" width="400" height="90" rx="14" fill="#e7f2ea"/>
  <text x="680" y="145" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">R1 → about $166k</text>
  <text x="680" y="175" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Newer players earn less</text>
  <rect x="660" y="220" width="400" height="90" rx="14" fill="#e7eef5"/>
  <text x="680" y="255" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">R2 → about $403k</text>
  <text x="680" y="285" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Veterans with fewer hits</text>
  <rect x="660" y="330" width="400" height="90" rx="14" fill="#e7eef5"/>
  <text x="680" y="365" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">R3 → about $846k</text>
  <text x="680" y="395" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Veterans with more hits</text>

</svg>
