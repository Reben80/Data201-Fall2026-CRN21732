<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <rect width="1120" height="520" fill="#f7f9fb" rx="20"/>

  <rect x="420" y="56" width="280" height="64" rx="14" fill="#0072b2" stroke="#004d7a" stroke-width="3"/>
  <text x="560" y="85" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Years &lt; 4.5 ?</text>
  <text x="560" y="106" text-anchor="middle" fill="#d6ebf7" font-family="Montserrat, Arial, sans-serif" font-size="13">first split</text>

  <line x1="480" y1="120" x2="280" y2="190" stroke="#1c2430" stroke-width="3"/>
  <line x1="640" y1="120" x2="840" y2="190" stroke="#1c2430" stroke-width="3"/>
  <text x="360" y="165" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="650">yes</text>
  <text x="760" y="165" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="650">no</text>

  <rect x="170" y="200" width="220" height="64" rx="12" fill="#0f7a72"/>
  <text x="280" y="230" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Salary ~ 5.1</text>
  <text x="280" y="250" text-anchor="middle" fill="#d9f2ef" font-family="Montserrat, Arial, sans-serif" font-size="13">prediction</text>

  <rect x="730" y="200" width="220" height="64" rx="12" fill="#0072b2"/>
  <text x="840" y="230" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Hits &lt; 117.5 ?</text>
  <text x="840" y="250" text-anchor="middle" fill="#d6ebf7" font-family="Montserrat, Arial, sans-serif" font-size="13">another split</text>

  <line x1="790" y1="264" x2="700" y2="330" stroke="#1c2430" stroke-width="3"/>
  <line x1="890" y1="264" x2="980" y2="330" stroke="#1c2430" stroke-width="3"/>

  <rect x="600" y="340" width="200" height="64" rx="12" fill="#0f7a72"/>
  <text x="700" y="370" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Salary ~ 6.0</text>
  <text x="700" y="390" text-anchor="middle" fill="#d9f2ef" font-family="Montserrat, Arial, sans-serif" font-size="13">prediction</text>

  <rect x="880" y="340" width="200" height="64" rx="12" fill="#0f7a72"/>
  <text x="980" y="370" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="650">Salary ~ 6.7</text>
  <text x="980" y="390" text-anchor="middle" fill="#d9f2ef" font-family="Montserrat, Arial, sans-serif" font-size="13">prediction</text>

  <path d="M 250 70 L 410 80" stroke="#0072b2" stroke-width="2.5" fill="none"/>
  <circle cx="250" cy="70" r="6" fill="#0072b2"/>
  <rect x="48" y="36" width="210" height="78" rx="12" fill="#ffffff" stroke="#0072b2" stroke-width="2"/>
  <text x="153" y="62" text-anchor="middle" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="700">Root</text>
  <text x="153" y="86" text-anchor="middle" fill="#3d4c5c" font-family="Montserrat, Arial, sans-serif" font-size="13">Top node / first question</text>
  <text x="153" y="104" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="12">Every row starts here</text>

  <path d="M 1040 180 L 960 220" stroke="#c45c26" stroke-width="2.5" fill="none"/>
  <circle cx="1040" cy="180" r="6" fill="#c45c26"/>
  <rect x="930" y="100" width="160" height="78" rx="12" fill="#ffffff" stroke="#c45c26" stroke-width="2"/>
  <text x="1010" y="126" text-anchor="middle" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">Internal node</text>
  <text x="1010" y="150" text-anchor="middle" fill="#3d4c5c" font-family="Montserrat, Arial, sans-serif" font-size="13">Also a question</text>
  <text x="1010" y="168" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="12">Splits on a feature</text>

  <path d="M 120 320 L 170 250" stroke="#0f7a72" stroke-width="2.5" fill="none"/>
  <circle cx="120" cy="320" r="6" fill="#0f7a72"/>
  <rect x="48" y="294" width="210" height="78" rx="12" fill="#ffffff" stroke="#0f7a72" stroke-width="2"/>
  <text x="153" y="320" text-anchor="middle" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="700">Leaf</text>
  <text x="153" y="344" text-anchor="middle" fill="#3d4c5c" font-family="Montserrat, Arial, sans-serif" font-size="13">Not a question</text>
  <text x="153" y="362" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="12">Stop and predict</text>

  <rect x="48" y="440" width="1024" height="56" rx="12" fill="#ffffff" stroke="#d7e0e8"/>
  <text x="560" y="474" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="17">Root and internal nodes ask questions. Leaves give the answer.</text>
</svg>
