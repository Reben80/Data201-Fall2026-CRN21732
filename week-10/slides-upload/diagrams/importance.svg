<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">

  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>
  <text x="48" y="44" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">Feature importance sums to 1</text>
  <rect x="120" y="120" width="700" height="48" rx="8" fill="#0072b2"/>
  <text x="140" y="150" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">worst radius</text>
  <text x="780" y="150" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">0.72</text>
  <rect x="120" y="190" width="220" height="48" rx="8" fill="#0f7a72"/>
  <text x="140" y="220" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">worst concave points</text>
  <text x="780" y="220" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">0.18</text>
  <rect x="120" y="260" width="90" height="48" rx="8" fill="#5c6b78"/>
  <text x="140" y="290" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">mean texture</text>
  <text x="780" y="290" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">0.06</text>
  <rect x="120" y="330" width="50" height="48" rx="8" fill="#c45c26"/>
  <text x="140" y="360" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">others</text>
  <text x="780" y="360" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">0.04</text>
  <text x="560" y="440" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="20">0 = never used. High = used in splits that reduced impurity a lot.</text>
  <text x="560" y="470" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Importance has no sign: it does not say whether high values mean class Yes or No.</text>

</svg>
