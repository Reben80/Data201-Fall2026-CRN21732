<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">

  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>
  <text x="48" y="44" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">Two ways to control complexity</text>
  <rect x="70" y="100" width="460" height="320" rx="18" fill="#ffffff" stroke="#0072b2" stroke-width="3"/>
  <text x="300" y="155" text-anchor="middle" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="650">Pre-pruning</text>
  <text x="300" y="200" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="20">Stop early while growing</text>
  <text x="110" y="255" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18">max_depth</text>
  <text x="110" y="290" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18">max_leaf_nodes</text>
  <text x="110" y="325" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18">min_samples_leaf</text>
  <text x="110" y="375" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Any one of these can curb overfitting.</text>
  <rect x="590" y="100" width="460" height="320" rx="18" fill="#ffffff" stroke="#0f7a72" stroke-width="3"/>
  <text x="820" y="155" text-anchor="middle" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="650">Post-pruning</text>
  <text x="820" y="200" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="20">Grow big, then cut back</text>
  <text x="630" y="255" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18">Cost-complexity pruning</text>
  <text x="630" y="290" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18">ccp_alpha in scikit-learn</text>
  <text x="630" y="325" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18">Larger alpha → smaller tree</text>
  <text x="630" y="375" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">A weak split now can unlock a better split later.</text>

</svg>
