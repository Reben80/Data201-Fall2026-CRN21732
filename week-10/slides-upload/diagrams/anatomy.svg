  <text x="280" y="145" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">X1 &lt; t1 ?</text>
  <line x1="220" y1="166" x2="140" y2="220" stroke="#1c2430" stroke-width="3"/>
  <line x1="340" y1="166" x2="420" y2="220" stroke="#1c2430" stroke-width="3"/>
