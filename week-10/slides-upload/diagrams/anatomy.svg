  <text x="420" y="265" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">X2 &lt; t2 ?</text>
  <line x1="380" y1="286" x2="340" y2="340" stroke="#1c2430" stroke-width="3"/>
