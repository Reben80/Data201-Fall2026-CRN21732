<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500"><rect width="1120" height="500" rx="20" fill="#f7f9fb"/><text x="48" y="50" font-family="Arial" font-size="26" font-weight="bold" fill="#1c2430">Four total features — but only TWO offered at this split</text><rect x="50" y="100" width="240" height="75" rx="14" fill="#e7f2fb" stroke="#84b3d0"/><text x="170" y="144" font-size="19" font-family="Arial" fill="#1c2430" text-anchor="middle">Study hours</text><rect x="318" y="100" width="240" height="75" rx="14" fill="#e7f2fb" stroke="#84b3d0"/><text x="438" y="144" font-size="19" font-family="Arial" fill="#1c2430" text-anchor="middle">Attendance</text><rect x="586" y="100" width="240" height="75" rx="14" fill="#e7f2fb" stroke="#84b3d0"/><text x="706" y="144" font-size="19" font-family="Arial" fill="#1c2430" text-anchor="middle">Previous GPA</text><rect x="854" y="100" width="240" height="75" rx="14" fill="#e7f2fb" stroke="#84b3d0"/><text x="974" y="144" font-size="19" font-family="Arial" fill="#1c2430" text-anchor="middle">Homework</text><path d="M170 175 L425 247 M706 175 L610 247" fill="none" stroke="#0f7a72" stroke-width="4"/><rect x="320" y="248" width="480" height="102" rx="17" fill="#e3f2ea" stroke="#0f7a72" stroke-width="2"/><text x="560" y="282" font-size="23" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#0f7a72">Random candidate subset</text><text x="560" y="321" font-size="19" text-anchor="middle" font-family="Arial" fill="#1c2430">Study hours + Previous GPA</text><text x="560" y="407" font-family="Arial" font-size="22" fill="#1c2430" text-anchor="middle">The tree chooses the BEST split of these two (using Gini).</text><text x="560" y="451" font-family="Arial" font-size="19" fill="#526371" text-anchor="middle">At the next node, a NEW random feature subset is considered.</text></svg>