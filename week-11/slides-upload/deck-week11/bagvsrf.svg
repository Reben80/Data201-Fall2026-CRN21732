<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480">
  <rect width="1120" height="480" fill="#f7f9fb" rx="20"/>
  <text x="48" y="42" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">Heart data: bagging vs random forest</text>
  <rect x="80" y="90" width="460" height="300" rx="16" fill="#ffffff" stroke="#d7e0e8"/>
  <text x="310" y="140" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="650">Bagging</text>
  <text x="310" y="200" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="18">Bootstrap rows: yes</text>
  <text x="310" y="250" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="18">m = p = 13 at every split</text>
  <text x="310" y="300" text-anchor="middle" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Trees more similar</text>
  <rect x="580" y="90" width="460" height="300" rx="16" fill="#ffffff" stroke="#0072b2" stroke-width="2"/>
  <text x="810" y="140" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="650">Random forest</text>
  <text x="810" y="200" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="18">Bootstrap rows: yes</text>
  <text x="810" y="250" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="18">m ≈ √p ≈ 4 at every split</text>
  <text x="810" y="300" text-anchor="middle" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Trees more different</text>
  <text x="560" y="440" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">ISLP: m ≈ √p often lowers test error versus m = p on this data.</text>
</svg>
