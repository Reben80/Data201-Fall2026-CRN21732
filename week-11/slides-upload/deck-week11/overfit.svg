<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480">
  <rect width="1120" height="480" fill="#f7f9fb" rx="20"/>
  <text x="48" y="42" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">One deep tree memorizes</text>
  <rect x="80" y="80" width="420" height="320" rx="16" fill="#ffffff" stroke="#d7e0e8"/>
  <text x="290" y="120" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Training set</text>
  <text x="290" y="200" text-anchor="middle" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="56" font-weight="700">100%</text>
  <text x="290" y="250" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="18">Perfect on data it has seen</text>
  <rect x="620" y="80" width="420" height="320" rx="16" fill="#ffffff" stroke="#d7e0e8"/>
  <text x="830" y="120" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Test set</text>
  <text x="830" y="200" text-anchor="middle" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="56" font-weight="700">~94%</text>
  <text x="830" y="250" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="18">Worse on new tumors</text>
  <text x="560" y="450" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="17">That gap is overfitting. Pre-pruning helps, but one tree is still unstable.</text>
</svg>
