<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>
  <text x="48" y="40" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="700">ISLP Exercise 5 idea: ten trees, one new observation</text>
  <g font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="650">
    <rect x="48" y="70" width="90" height="70" rx="10" fill="#0f7a72"/><text x="93" y="100" text-anchor="middle" fill="#fff">0.10</text><text x="93" y="122" text-anchor="middle" fill="#d9f2ef" font-size="12">Green</text>
    <rect x="150" y="70" width="90" height="70" rx="10" fill="#0f7a72"/><text x="195" y="100" text-anchor="middle" fill="#fff">0.15</text><text x="195" y="122" text-anchor="middle" fill="#d9f2ef" font-size="12">Green</text>
    <rect x="252" y="70" width="90" height="70" rx="10" fill="#0f7a72"/><text x="297" y="100" text-anchor="middle" fill="#fff">0.20</text><text x="297" y="122" text-anchor="middle" fill="#d9f2ef" font-size="12">Green</text>
    <rect x="354" y="70" width="90" height="70" rx="10" fill="#0f7a72"/><text x="399" y="100" text-anchor="middle" fill="#fff">0.20</text><text x="399" y="122" text-anchor="middle" fill="#d9f2ef" font-size="12">Green</text>
    <rect x="456" y="70" width="90" height="70" rx="10" fill="#c45c26"/><text x="501" y="100" text-anchor="middle" fill="#fff">0.55</text><text x="501" y="122" text-anchor="middle" fill="#f8e5d9" font-size="12">Red</text>
    <rect x="558" y="70" width="90" height="70" rx="10" fill="#c45c26"/><text x="603" y="100" text-anchor="middle" fill="#fff">0.60</text><text x="603" y="122" text-anchor="middle" fill="#f8e5d9" font-size="12">Red</text>
    <rect x="660" y="70" width="90" height="70" rx="10" fill="#c45c26"/><text x="705" y="100" text-anchor="middle" fill="#fff">0.60</text><text x="705" y="122" text-anchor="middle" fill="#f8e5d9" font-size="12">Red</text>
    <rect x="762" y="70" width="90" height="70" rx="10" fill="#c45c26"/><text x="807" y="100" text-anchor="middle" fill="#fff">0.65</text><text x="807" y="122" text-anchor="middle" fill="#f8e5d9" font-size="12">Red</text>
    <rect x="864" y="70" width="90" height="70" rx="10" fill="#c45c26"/><text x="909" y="100" text-anchor="middle" fill="#fff">0.70</text><text x="909" y="122" text-anchor="middle" fill="#f8e5d9" font-size="12">Red</text>
    <rect x="966" y="70" width="90" height="70" rx="10" fill="#c45c26"/><text x="1011" y="100" text-anchor="middle" fill="#fff">0.75</text><text x="1011" y="122" text-anchor="middle" fill="#f8e5d9" font-size="12">Red</text>
  </g>
  <rect x="48" y="190" width="500" height="220" rx="16" fill="#ffffff" stroke="#d7e0e8"/>
  <text x="298" y="240" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Majority vote</text>
  <text x="298" y="290" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="17">6 of 10 trees vote Red</text>
  <text x="298" y="340" text-anchor="middle" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700">Predict Red</text>
  <rect x="572" y="190" width="500" height="220" rx="16" fill="#ffffff" stroke="#d7e0e8"/>
  <text x="822" y="240" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Average probability</text>
  <text x="822" y="290" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="17">mean P(Red) = 0.45</text>
  <text x="822" y="340" text-anchor="middle" fill="#0f7a72" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700">Predict Green</text>
  <text x="560" y="460" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">sklearn random forests use averaged probabilities (right panel), not hard majority vote.</text>
</svg>
