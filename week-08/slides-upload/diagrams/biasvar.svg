<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">

  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>
  <text x="48" y="44" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">Two ways to be wrong</text>
  <rect x="60" y="100" width="300" height="300" rx="18" fill="#ffffff" stroke="#d5dee6"/>
  <circle cx="210" cy="220" r="70" fill="none" stroke="#d5dee6" stroke-width="3"/>
  <circle cx="210" cy="220" r="8" fill="#1c2430"/>
  <circle cx="250" cy="250" r="10" fill="#c45c26"/><circle cx="265" cy="235" r="10" fill="#c45c26"/>
  <circle cx="240" cy="265" r="10" fill="#c45c26"/><circle cx="275" cy="255" r="10" fill="#c45c26"/>
  <text x="210" y="360" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">High bias</text>
  <text x="210" y="388" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Always misses the center</text>
  <rect x="410" y="100" width="300" height="300" rx="18" fill="#ffffff" stroke="#d5dee6"/>
  <circle cx="560" cy="220" r="70" fill="none" stroke="#d5dee6" stroke-width="3"/>
  <circle cx="560" cy="220" r="8" fill="#1c2430"/>
  <circle cx="520" cy="180" r="10" fill="#c45c26"/><circle cx="600" cy="170" r="10" fill="#c45c26"/>
  <circle cx="510" cy="260" r="10" fill="#c45c26"/><circle cx="610" cy="255" r="10" fill="#c45c26"/>
  <text x="560" y="360" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">High variance</text>
  <text x="560" y="388" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Jumps with every sample</text>
  <rect x="760" y="100" width="300" height="300" rx="18" fill="#ffffff" stroke="#d5dee6"/>
  <circle cx="910" cy="220" r="70" fill="none" stroke="#d5dee6" stroke-width="3"/>
  <circle cx="910" cy="220" r="8" fill="#1c2430"/>
  <circle cx="900" cy="210" r="10" fill="#0072b2"/><circle cx="920" cy="230" r="10" fill="#0072b2"/>
  <circle cx="895" cy="230" r="10" fill="#0072b2"/><circle cx="925" cy="205" r="10" fill="#0072b2"/>
  <text x="910" y="360" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="650">Balanced</text>
  <text x="910" y="388" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">Close and stable</text>
  <text x="560" y="460" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="20">Test error is roughly bias squared plus variance plus noise.</text>

</svg>
