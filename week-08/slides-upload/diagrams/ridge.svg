<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">

  <rect width="1120" height="500" fill="#f7f9fb" rx="20"/>
  <text x="48" y="44" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="700">Ridge shrinks every bar. None hits zero.</text>
  <text x="300" y="100" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="18">Least squares</text>
  <text x="840" y="100" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="18">Ridge</text>
  <rect x="100" y="230" width="50" height="90" rx="8" fill="#c45c26"/><text x="125" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x1</text><rect x="180" y="250" width="50" height="70" rx="8" fill="#c45c26"/><text x="205" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x2</text><rect x="260" y="265" width="50" height="55" rx="8" fill="#c45c26"/><text x="285" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x3</text><rect x="340" y="280" width="50" height="40" rx="8" fill="#c45c26"/><text x="365" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x4</text><rect x="420" y="290" width="50" height="30" rx="8" fill="#c45c26"/><text x="445" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x5</text>
  <rect x="640" y="265" width="50" height="55" rx="8" fill="#0072b2"/><text x="665" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x1</text><rect x="720" y="278" width="50" height="42" rx="8" fill="#0072b2"/><text x="745" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x2</text><rect x="800" y="286" width="50" height="34" rx="8" fill="#0072b2"/><text x="825" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x3</text><rect x="880" y="296" width="50" height="24" rx="8" fill="#0072b2"/><text x="905" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x4</text><rect x="960" y="302" width="50" height="18" rx="8" fill="#0072b2"/><text x="985" y="360" text-anchor="middle" fill="#5c6b78" font-family="Montserrat, Arial, sans-serif" font-size="16">x5</text>
  <text x="300" y="420" text-anchor="middle" fill="#c45c26" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Large, unstable weights</text>
  <text x="840" y="420" text-anchor="middle" fill="#0072b2" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="650">Smaller weights, every feature stays</text>
  <text x="560" y="465" text-anchor="middle" fill="#1c2430" font-family="Montserrat, Arial, sans-serif" font-size="18">Penalty: sum of squared coefficients. Correlated features share the load.</text>

</svg>
